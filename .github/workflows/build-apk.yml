package com.example.wastatclone;

import android.app.Activity;
import android.app.AlertDialog;
import android.graphics.Color;
import android.graphics.drawable.GradientDrawable;
import android.os.Bundle;
import android.view.Gravity;
import android.widget.*;

import java.text.SimpleDateFormat;
import java.util.*;

public class MainActivity extends Activity {

    LinearLayout root;
    LinearLayout contactList;
    LinearLayout timelineList;

    TextView contactCount;
    TextView onlineCount;
    TextView offlineCount;
    TextView lastSeenCount;

    ArrayList<String> contacts = new ArrayList<>();
    ArrayList<Event> events = new ArrayList<>();

    android.content.SharedPreferences prefs;

    SimpleDateFormat fullDate =
            new SimpleDateFormat("dd MMM yyyy, hh:mm a", Locale.getDefault());

    SimpleDateFormat dayDate =
            new SimpleDateFormat("dd MMM", Locale.getDefault());

    static class Event {
        String contact;
        String type;
        long time;

        Event(String contact, String type, long time) {
            this.contact = contact;
            this.type = type;
            this.time = time;
        }
    }

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        prefs = getSharedPreferences("wastat_data", MODE_PRIVATE);

        loadData();
        buildUI();
        render();
    }

    void buildUI() {

        ScrollView scroll = new ScrollView(this);

        root = new LinearLayout(this);
        root.setOrientation(LinearLayout.VERTICAL);
        root.setPadding(18, 18, 18, 30);
        root.setBackgroundColor(Color.rgb(245, 247, 250));

        scroll.addView(root);

        TextView title = text(
                "WaStat Style",
                28,
                Color.BLACK
        );
        title.setTypeface(null, 1);

        root.addView(title);

        TextView subtitle = text(
                "Activity Dashboard",
                15,
                Color.DKGRAY
        );

        root.addView(subtitle);

        space(18);

        LinearLayout stats1 = row();

        contactCount = statCard(stats1, "Contacts");
        onlineCount = statCard(stats1, "Online");
        offlineCount = statCard(stats1, "Offline");

        root.addView(stats1);

        space(10);

        LinearLayout stats2 = row();

        lastSeenCount = statCard(stats2, "Last Seen");

        TextView total = statCard(stats2, "30 Days");

        root.addView(stats2);

        space(20);

        Button add = new Button(this);
        add.setText("＋  Add Contact");
        add.setOnClickListener(v -> addContact());

        root.addView(add);

        space(16);

        TextView contactTitle = text(
                "Your Contacts",
                21,
                Color.BLACK
        );
        contactTitle.setTypeface(null, 1);

        root.addView(contactTitle);

        contactList = new LinearLayout(this);
        contactList.setOrientation(LinearLayout.VERTICAL);

        root.addView(contactList);

        space(22);

        TextView statisticsTitle = text(
                "30 Days Statistics",
                21,
                Color.BLACK
        );
        statisticsTitle.setTypeface(null, 1);

        root.addView(statisticsTitle);

        space(8);

        LinearLayout chart = createChart();

        root.addView(chart);

        space(22);

        TextView timelineTitle = text(
                "Activity Timeline",
                21,
                Color.BLACK
        );
        timelineTitle.setTypeface(null, 1);

        root.addView(timelineTitle);

        timelineList = new LinearLayout(this);
        timelineList.setOrientation(LinearLayout.VERTICAL);

        root.addView(timelineList);

        space(12);

        Button clear = new Button(this);
        clear.setText("🗑  Clear History");
        clear.setOnClickListener(v -> clearHistory());

        root.addView(clear);

        setContentView(scroll);
    }

    LinearLayout createChart() {

        LinearLayout chart = new LinearLayout(this);

        chart.setOrientation(LinearLayout.VERTICAL);
        chart.setPadding(14, 14, 14, 14);

        GradientDrawable bg = new GradientDrawable();
        bg.setColor(Color.WHITE);
        bg.setCornerRadius(22);

        chart.setBackground(bg);

        int[] daily = getLast30Days();

        for (int i = 0; i < 30; i++) {

            LinearLayout line = new LinearLayout(this);
            line.setGravity(Gravity.CENTER_VERTICAL);

            TextView date = text(
                    getDateLabel(i),
                    11,
                    Color.DKGRAY
            );

            date.setGravity(Gravity.CENTER);

            line.addView(
                    date,
                    new LinearLayout.LayoutParams(55, 35)
            );

            LinearLayout barArea = new LinearLayout(this);

            barArea.setGravity(Gravity.CENTER_VERTICAL);

            int value = daily[i];

            TextView bar = new TextView(this);

            GradientDrawable barBg = new GradientDrawable();
            barBg.setColor(Color.rgb(76, 175, 80));
            barBg.setCornerRadius(10);

            bar.setBackground(barBg);

            int width = Math.min(
                    240,
                    Math.max(5, value * 35)
            );

            barArea.addView(
                    bar,
                    new LinearLayout.LayoutParams(
                            width,
                            18
                    )
            );

            TextView number = text(
                    " " + value,
                    12,
                    Color.DKGRAY
            );

            barArea.addView(number);

            line.addView(
                    barArea,
                    new LinearLayout.LayoutParams(
                            0,
                            35,
                            1
                    )
            );

            chart.addView(line);
        }

        return chart;
    }

    String getDateLabel(int index) {

        Calendar c = Calendar.getInstance();

        c.add(Calendar.DAY_OF_YEAR, -(29 - index));

        return dayDate.format(c.getTime());
    }

    int[] getLast30Days() {

        int[] result = new int[30];

        Calendar today = Calendar.getInstance();

        for (Event e : events) {

            Calendar eventDay = Calendar.getInstance();
            eventDay.setTimeInMillis(e.time);

            long diff =
                    getDayNumber(today)
                    - getDayNumber(eventDay);

            if (diff >= 0 && diff < 30) {

                int index = 29 - (int) diff;

                result[index]++;
            }
        }

        return result;
    }

    long getDayNumber(Calendar c) {

        Calendar copy = (Calendar) c.clone();

        copy.set(
                Calendar.HOUR_OF_DAY,
                0
        );
        copy.set(
                Calendar.MINUTE,
                0
        );
        copy.set(
                Calendar.SECOND,
                0
        );
        copy.set(
                Calendar.MILLISECOND,
                0
        );

        return copy.getTimeInMillis()
                / (24L * 60L * 60L * 1000L);
    }

    void addContact() {

        final EditText input = new EditText(this);

        input.setHint("Name or WhatsApp number");
        input.setSingleLine(true);

        new AlertDialog.Builder(this)
                .setTitle("Add Contact")
                .setView(input)
                .setNegativeButton(
                        "Cancel",
                        null
                )
                .setPositiveButton(
                        "Add",
                        (dialog, which) -> {

                            String name =
                                    input.getText()
                                            .toString()
                                            .trim();

                            if (name.isEmpty())
                                return;

                            if (contacts.contains(name)) {

                                Toast.makeText(
                                        this,
                                        "Contact already added",
                                        Toast.LENGTH_SHORT
                                ).show();

                                return;
                            }

                            contacts.add(name);

                            saveData();
                            render();
                        }
                )
                .show();
    }

    void addContactCard(String name) {

        LinearLayout card = new LinearLayout(this);

        card.setOrientation(
                LinearLayout.VERTICAL
        );

        card.setPadding(
                14,
                12,
                14,
                12
        );

        GradientDrawable bg =
                new GradientDrawable();

        bg.setColor(Color.WHITE);
        bg.setCornerRadius(20);

        card.setBackground(bg);

        TextView title =
                text(name, 18, Color.BLACK);

        title.setTypeface(null, 1);

        card.addView(title);

        LinearLayout buttons = row();

        Button online = new Button(this);
        online.setText("Online");

        Button offline = new Button(this);
        offline.setText("Offline");

        Button seen = new Button(this);
        seen.setText("Last Seen");

        buttons.addView(
                online,
                new LinearLayout.LayoutParams(
                        0,
                        55,
                        1
                )
        );

        buttons.addView(
                offline,
                new LinearLayout.LayoutParams(
                        0,
                        55,
                        1
                )
        );

        buttons.addView(
                seen,
                new LinearLayout.LayoutParams(
                        0,
                        55,
                        1
                )
        );

        online.setOnClickListener(
                v -> recordEvent(
                        name,
                        "ONLINE"
                )
        );

        offline.setOnClickListener(
                v -> recordEvent(
                        name,
                        "OFFLINE"
                )
        );

        seen.setOnClickListener(
                v -> recordEvent(
                        name,
                        "LAST SEEN"
                )
        );

        card.addView(buttons);

        LinearLayout.LayoutParams p =
                new LinearLayout.LayoutParams(
                        -1,
                        -2
                );

        p.setMargins(
                0,
                5,
                0,
                5
        );

        contactList.addView(card, p);
    }

    void recordEvent(
            String contact,
            String type
    ) {

        events.add(
                0,
                new Event(
                        contact,
                        type,
                        System.currentTimeMillis()
                )
        );

        if (events.size() > 500)
            events.remove(events.size() - 1);

        saveData();
        render();

        Toast.makeText(
                this,
                type + " recorded",
                Toast.LENGTH_SHORT
        ).show();
    }

    void render() {

        if (contactList == null)
            return;

        contactList.removeAllViews();
        timelineList.removeAllViews();

        int online = 0;
        int offline = 0;
        int lastSeen = 0;

        long thirtyDays =
                System.currentTimeMillis()
                        - (30L * 24L * 60L * 60L * 1000L);

        for (Event e : events) {

            if (e.time < thirtyDays)
                continue;

            if (e.type.equals("ONLINE"))
                online++;

            if (e.type.equals("OFFLINE"))
                offline++;

            if (e.type.equals("LAST SEEN"))
                lastSeen++;
        }

        contactCount.setText(
                String.valueOf(contacts.size())
        );

        onlineCount.setText(
                String.valueOf(online)
        );

        offlineCount.setText(
                String.valueOf(offline)
        );

        lastSeenCount.setText(
                String.valueOf(lastSeen)
        );

        for (String c : contacts)
            addContactCard(c);

        renderTimeline();
    }

    void renderTimeline() {

        if (events.isEmpty()) {

            TextView empty = text(
                    "No activity recorded yet.",
                    15,
                    Color.GRAY
            );

            empty.setPadding(
                    8,
                    12,
                    8,
                    12
            );

            timelineList.addView(empty);

            return;
        }

        long thirtyDays =
                System.currentTimeMillis()
                        - (30L * 24L * 60L * 60L * 1000L);

        int shown = 0;

        for (Event e : events) {

            if (e.time < thirtyDays)
                continue;

            LinearLayout item =
                    new LinearLayout(this);

            item.setOrientation(
                    LinearLayout.VERTICAL
            );

            item.setPadding(
                    14,
                    10,
                    14,
                    10
            );

            GradientDrawable bg =
                    new GradientDrawable();

            bg.setColor(Color.WHITE);
            bg.setCornerRadius(18);

            item.setBackground(bg);

            TextView contact =
                    text(
                            e.contact,
                            17,
                            Color.BLACK
                    );

            contact.setTypeface(null, 1);

            String icon = "•";

            if (e.type.equals("ONLINE"))
                icon = "🟢";

            else if (e.type.equals("OFFLINE"))
                icon = "🔴";

            else if (e.type.equals("LAST SEEN"))
                icon = "🕐";

            TextView eventText =
                    text(
                            icon + "  " + e.type,
                            14,
                            Color.DKGRAY
                    );

            TextView time =
                    text(
                            fullDate.format(
                                    new Date(e.time)
                            ),
                            12,
                            Color.GRAY
                    );

            item.addView(contact);
            item.addView(eventText);
            item.addView(time);

            LinearLayout.LayoutParams p =
                    new LinearLayout.LayoutParams(
                            -1,
                            -2
                    );

            p.setMargins(
                    0,
                    5,
                    0,
                    5
            );

            timelineList.addView(
                    item,
                    p
            );

            shown++;

            if (shown >= 100)
                break;
        }
    }

    void clearHistory() {

        new AlertDialog.Builder(this)
                .setTitle("Clear History?")
                .setMessage(
                        "All recorded activity will be removed."
                )
                .setNegativeButton(
                        "Cancel",
                        null
                )
                .setPositiveButton(
                        "Clear",
                        (dialog, which) -> {

                            events.clear();

                            saveData();
                            render();
                        }
                )
                .show();
    }

    void loadData() {

        String savedContacts =
                prefs.getString(
                        "contacts",
                        ""
                );

        if (!savedContacts.isEmpty()) {

            contacts.addAll(
                    Arrays.asList(
                            savedContacts.split("\\|")
                    )
            );
        }

        String savedEvents =
                prefs.getString(
                        "events",
                        ""
                );

        if (!savedEvents.isEmpty()) {

            String[] rows =
                    savedEvents.split("\n");

            for (String row : rows) {

                String[] parts =
                        row.split("\\|");

                if (parts.length == 3) {

                    try {

                        events.add(
                                new Event(
                                        parts[0],
                                        parts[1],
                                        Long.parseLong(
                                                parts[2]
                                        )
                                )
                        );

                    } catch (Exception ignored) {
                    }
                }
            }
        }
    }

    void saveData() {

        StringBuilder c =
                new StringBuilder();

        for (String name : contacts) {

            if (c.length() > 0)
                c.append("|");

            c.append(
                    name.replace("|", "")
            );
        }

        StringBuilder e =
                new StringBuilder();

        for (Event event : events) {

            if (e.length() > 0)
                e.append("\n");

            e.append(
                    event.contact.replace("|", "")
            );

            e.append("|");

            e.append(event.type);

            e.append("|");

            e.append(event.time);
        }

        prefs.edit()
                .putString(
                        "contacts",
                        c.toString()
                )
                .putString(
                        "events",
                        e.toString()
                )
                .apply();
    }

    LinearLayout row() {

        LinearLayout l =
                new LinearLayout(this);

        l.setOrientation(
                LinearLayout.HORIZONTAL
        );

        return l;
    }

    TextView statCard(
            LinearLayout parent,
            String label
    ) {

        LinearLayout card =
                new LinearLayout(this);

        card.setOrientation(
                LinearLayout.VERTICAL
        );

        card.setGravity(
                Gravity.CENTER
        );

        card.setPadding(
                10,
                10,
                10,
                10
        );

        GradientDrawable bg =
                new GradientDrawable();

        bg.setColor(Color.WHITE);
        bg.setCornerRadius(22);

        card.setBackground(bg);

        TextView number =
                text("0", 23, Color.BLACK);

        number.setGravity(
                Gravity.CENTER
        );

        number.setTypeface(null, 1);

        TextView name =
                text(
                        label,
                        12,
                        Color.DKGRAY
                );

        name.setGravity(
                Gravity.CENTER
        );

        card.addView(number);
        card.addView(name);

        parent.addView(
                card,
                new LinearLayout.LayoutParams(
                        0,
                        90,
                        1
                )
        );

        return number;
    }

    TextView text(
            String value,
            float size,
            int color
    ) {

        TextView t =
                new TextView(this);

        t.setText(value);
        t.setTextSize(size);
        t.setTextColor(color);

        return t;
    }

    void space(int height) {

        Space s = new Space(this);

        root.addView(
                s,
                new LinearLayout.LayoutParams(
                        1,
                        height
                )
        );
    }
}
