        root.addView(timelineTitle);

        timelineList = new LinearLayout(this);
        timelineList.setOrientation(LinearLayout.VERTICAL);

        root.addView(timelineList);

        space(12);

        Button clear = new Button(this);
        clear.setText("🗑  Clear History");
