    LinearLayout createChart() {

        LinearLayout chart = new LinearLayout(this);

        chart.setOrientation(LinearLayout.VERTICAL);
        chart.setPadding(14, 14, 14, 14);

        GradientDrawable bg = new GradientDrawable();
        bg.setColor(Color.WHITE);
        bg.setCornerRadius(22);

        chart.setBackground(bg);

        int[] daily = getLast30Days();

        for (int i = 0; i < 30; i++) {

            LinearLayout line = new LinearLayout(this);
            line.setGravity(Gravity.CENTER_VERTICAL);

            TextView date = text(
                    getDateLabel(i),
                    11,
                    Color.DKGRAY
            );

            date.setGravity(Gravity.CENTER);

            line.addView(
                    date,
                    new LinearLayout.LayoutParams(55, 35)
            );

            LinearLayout barArea = new LinearLayout(this);

            barArea.setGravity(Gravity.CENTER_VERTICAL);

            int value = daily[i];

            TextView bar = new TextView(this);

            GradientDrawable barBg = new GradientDrawable();
            barBg.setColor(Color.rgb(76, 175, 80));
            barBg.setCornerRadius(10);

            bar.setBackground(barBg);

            int width = Math.min(
                    240,
                    Math.max(5, value * 35)
            );

            barArea.addView(
                    bar,
                    new LinearLayout.LayoutParams(
                            width,
                            18
                    )
            );

            TextView number = text(
                    " " + value,
                    12,
                    Color.DKGRAY
            );

            barArea.addView(number);

            line.addView(
                    barArea,
                    new LinearLayout.LayoutParams(
                            0,
                            35,
                            1
                    )
            );

            chart.addView(line);
        }

        return chart;
    }

    String getDateLabel(int index) {

        Calendar c = Calendar.getInstance();

        c.add(Calendar.DAY_OF_YEAR, -(29 - index));

        return dayDate.format(c.getTime());
    }

    int[] getLast30Days() {

        int[] result = new int[30];

        Calendar today = Calendar.getInstance();

        for (Event e : events) {

            Calendar eventDay = Calendar.getInstance();
            eventDay.setTimeInMillis(e.time);

            long diff =
                    getDayNumber(today)
                    - getDayNumber(eventDay);

            if (diff >= 0 && diff < 30) {

                int index = 29 - (int) diff;

                result[index]++;
            }
        }

        return result;
    }

    long getDayNumber(Calendar c) {

        Calendar copy = (Calendar) c.clone();

        copy.set(
                Calendar.HOUR_OF_DAY,
                0
        );
        copy.set(
                Calendar.MINUTE,
                0
        );
        copy.set(
                Calendar.SECOND,
                0
        );
        copy.set(
                Calendar.MILLISECOND,
                0
        );

        return copy.getTimeInMillis()
                / (24L * 60L * 60L * 1000L);
    }

